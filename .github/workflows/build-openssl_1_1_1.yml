name: Openssl 1.1.1 CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: debian:bullseye
      
    steps:
    - uses: actions/checkout@v6
    - name: install packages
      run: apt -y update && apt-get install -y build-essential cmake libssl-dev libcurl4-gnutls-dev
    - name: configure
      run: cmake .
    - name: make
      run: make
    
